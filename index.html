<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StandBy Canvas OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LANDSCAPE MODE: 4x2 MODULAR WIDGET SURFACE -->
    <div id="landscape-view" class="view">
        <div id="grid-surface" class="surface-matrix">
            <!-- Widgets will be injected dynamically into grid spaces via JS -->
        </div>

        <!-- IOS INSPIRED GALLERY SHEET WIDGET DRAWER (Triggered on Long Press) -->
        <div id="widget-drawer" class="drawer-panel">
            <div class="drawer-header">
                <div class="drawer-handle"></div>
                <h4>Add Widget</h4>
            </div>
            <div class="drawer-items">
                <div class="drawer-item-card" data-widget="clock">
                    <div class="mini-preview">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span>Clock</span>
                </div>
                <div class="drawer-item-card" data-widget="music">
                    <div class="mini-preview">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
                            <path d="M9 18V5l11-2v13" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="17" cy="16" r="3"/>
                        </svg>
                    </div>
                    <span>Music</span>
                </div>
                <div class="drawer-item-card" data-widget="weather">
                    <div class="mini-preview">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
                            <path d="M17.5 17.5H7a4 4 0 1 1 1.1-7.85A5 5 0 0 1 18 11a3.5 3.5 0 0 1-.5 6.5Z" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span>Weather</span>
                </div>
                <div class="drawer-item-card" data-widget="pet">
                    <div class="mini-preview">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
                            <circle cx="12" cy="13" r="7"/>
                            <path d="M9 11h.01M15 11h.01" stroke-linecap="round" stroke-width="2.4"/>
                            <path d="M9.5 15.5c1 1 4 1 5 0" stroke-linecap="round"/>
                            <path d="M8 6.5C7 5 5 5 4.5 6.5M16 6.5C17 5 19 5 19.5 6.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span>Pet</span>
                </div>
                <div class="drawer-item-card" data-widget="timer">
                    <div class="mini-preview">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
                            <circle cx="12" cy="13" r="8"/>
                            <path d="M12 9v4l3 2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 2h6" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span>Timer</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PORTRAIT MODE: FULLSCREEN NO-NAV CANVAS PLANNER -->
    <div id="portrait-view" class="view">

        <!-- Fixed 768x1024 stage matching the iPad mini's rotated resolution.
             Everything portrait-related lives inside this frame instead of
             being positioned against the live browser viewport, so the
             layout is identical on iPad and on a Mac browser window. -->
        <div id="portrait-stage" class="stage-portrait">

            <!-- FREEFORM INFINITE CANVAS MAP -->
            <div id="canvas">
                <!-- Generated draggable note items go here -->
            </div>

            <!-- FLOATING DESTRUCTIVE TRASH DISPOSAL ZONE -->
            <div id="trash-bin" class="floating-trash">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M4 7h16" stroke-linecap="round"/>
                    <path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7" stroke-linejoin="round"/>
                    <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke-linejoin="round"/>
                    <path d="M10 11v6M14 11v6" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- SLEEK ADD CONTROLLER CORNER BUTTON -->
            <button id="fab-trigger" class="action-fab">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- FLOATING UTILITY SELECTION COMPONENT MENU (anchored beside FAB) -->
            <div id="fab-popup" class="fab-popup">
                <button class="menu-action-item" id="fab-add-note">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M6 3h9l4 4v14H6z" stroke-linejoin="round"/>
                            <path d="M15 3v4h4M9 12h6M9 16h6" stroke-linecap="round"/>
                        </svg>
                    </span>
                    Sticky Note
                </button>
                <button class="menu-action-item" id="fab-add-todo">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M9 11l2.5 2.5L19 6" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4" y="4" width="16" height="16" rx="4" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    To-Do Checklist
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
