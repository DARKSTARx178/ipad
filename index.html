<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StandBy Canvas OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LANDSCAPE MODE: 4x2 MODULAR WIDGET SURFACE -->
    <div id="landscape-view" class="view">
        <div id="grid-surface" class="surface-matrix">
            <!-- Widgets will be injected dynamically into grid spaces via JS -->
        </div>

        <!-- IOS INSPIRED GALLERY SHEET WIDGET DRAWER (Triggered on Long Press) -->
        <div id="widget-drawer" class="drawer-panel">
            <div class="drawer-header">
                <div class="drawer-handle"></div>
                <h4>Add Widget Component</h4>
            </div>
            <div class="drawer-items">
                <div class="drawer-item-card" data-widget="clock">
                    <div class="mini-preview">09:41</div>
                    <span>Sleek Clock (2x1)</span>
                </div>
                <div class="drawer-item-card" data-widget="pomodoro">
                    <div class="mini-preview">⏱</div>
                    <span>Rotary Timer (2x1)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PORTRAIT MODE: FULLSCREEN NO-NAV CANVAS PLANNER -->
    <div id="portrait-view" class="view">

        <!-- FREEFORM INFINITE CANVAS MAP -->
        <div id="canvas">
            <!-- Generated draggable note items go here -->
        </div>

        <!-- FLOATING DESTRUCTIVE TRASH DISPOSAL ZONE -->
        <div id="trash-bin" class="floating-trash">
            <span class="trash-icon">🗑️</span>
        </div>

        <!-- SLEEK ADD CONTROLLER CORNER BUTTON -->
        <button id="fab-trigger" class="action-fab">+</button>

        <!-- FLOATING UTILITY SELECTION COMPONENT MENU -->
        <div id="fab-popup" class="fab-modal">
            <div class="fab-modal-content">
                <h4>Create Component</h4>
                <button id="fab-add-note" class="menu-action-item">📝 Sticky Note</button>
                <button id="fab-add-todo" class="menu-action-item">✅ To-Do Checklist</button>
                <button id="fab-close" class="menu-action-item cancel-item">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
