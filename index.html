<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desk Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDSCAPE MODE: CLOCK FACE -->
  <div id="landscape-clock" class="view">
    <div class="clock-container">
      <div id="time">00:00:00</div>
      <div id="date">LOADING...</div>
    </div>
  </div>

  <!-- PORTRAIT MODE: MIRO-STYLE WHITEBOARD -->
  <div id="portrait-whiteboard" class="view">
    <div class="board-header">
      <h2>Workspace Board</h2>
      <button id="add-note-btn">+ Add Note</button>
    </div>
    <div id="canvas">
      <!-- Notes are generated here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
