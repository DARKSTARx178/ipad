<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StandBy Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LANDSCAPE MODE: APPLE STANDBY METRIC WIDGET DISPLAY -->
    <div id="landscape-view" class="view">
        <div class="standby-container">

            <!-- STANDBY SIDE 1: GIANT CLOCK TYPOGRAPHY -->
            <div class="standby-widget" id="standby-clock">
                <div id="apple-time">00:00</div>
                <div id="apple-date">LOADING...</div>
            </div>

            <!-- STANDBY SIDE 2: MINIMALIST POMODORO CONTROLLER -->
            <div class="standby-widget" id="standby-pomodoro">
                <div class="pomo-wrapper">
                    <div id="pomo-time">25:00</div>
                    <div class="pomo-actions">
                        <button id="pomo-start-btn">Start</button>
                        <button id="pomo-reset-btn">Reset</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- BACKGROUND CUSTOMIZER PANEL (Triggered via Long Press) -->
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <h3>Theme Customizer</h3>
                <label>Select Background Theme:</label>
                <select id="theme-selector">
                    <option value="pitch-black">Pure Pitch Black</option>
                    <option value="midnight-blue">Midnight Velvet Blue</option>
                    <option value="aurora-purple">Deep Cosmic Purple</option>
                    <option value="charcoal-fade">Gentle Charcoal Gradient</option>
                </select>
                <div class="modal-actions">
                    <button id="save-settings-btn">Apply Theme</button>
                    <button id="close-modal-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PORTRAIT MODE: MIRO-STYLE FREEFORM PLANNING CANVAS -->
    <div id="portrait-view" class="view">
        <div class="board-header">
            <h2>Freeform Board</h2>
            <div class="header-actions">
                <button id="add-todo-btn">+ Add To-Do Item</button>
                <button id="add-note-btn">+ Add Sticky Note</button>
            </div>
        </div>

        <!-- UNIFIED INFINITE DRAGGABLE CANVAS FOR BOTH NOTES & TASKS -->
        <div id="canvas">
            <!-- Generated blocks go here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
